<title>NOIR ATELIER — The Rail</title>
<meta name="description" content="Noir Atelier: heavyweight tees, hoodies, knits and coats, cut oversized and made in small runs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234a0e1a'/%3E%3Ctext x='50' y='64' font-size='42' text-anchor='middle' fill='%23b8923f' font-family='serif'%3ENA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecdd;--ink:#2a0b13;--wine:#4a0e1a;--gold:#b8923f;--muted:#7a6a62;--tag:#fbf7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0b13;--ink:#f3ecdd;--wine:#e6d9bd;--gold:#d4ae5c;--muted:#b9a79c;--tag:#f3ecdd}}
:root[data-theme="dark"]{--bg:#2a0b13;--ink:#f3ecdd;--wine:#e6d9bd;--gold:#d4ae5c;--muted:#b9a79c;--tag:#f3ecdd}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.orb{position:fixed;border-radius:50%;border:1px solid var(--gold);opacity:.35;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;left:-120px;top:18%}.o2{width:220px;height:220px;right:6%;top:8%;animation-delay:-5s}.o3{width:120px;height:120px;right:22%;bottom:12%;animation-delay:-9s;background:radial-gradient(circle,var(--gold),transparent 70%);opacity:.18;border:0}
@keyframes drift{to{transform:translate(40px,-60px) scale(1.12)}}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:12px;font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:.14em;color:var(--wine)}
.mono{width:38px;height:38px;border:1px solid var(--gold);display:grid;place-items:center;position:relative;font-size:15px;letter-spacing:0;animation:spin 12s linear infinite}
.mono::before{content:"";position:absolute;inset:3px;border:1px solid var(--gold)}
.mono b{font-weight:600;animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
nav ul{display:flex;gap:28px;list-style:none;font-size:14px}
nav a{color:var(--ink);text-decoration:none}
nav a:hover,nav a:focus-visible{color:var(--gold);outline:none}
.bag{border:1px solid var(--gold);background:none;color:var(--ink);padding:9px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.bag:focus-visible,.ctl button:focus-visible,.garment:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{text-align:center;padding:4vh 5vw 0;position:relative;z-index:2}
header p.k{font-size:13px;color:var(--muted);letter-spacing:.04em}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(40px,7.5vw,92px);line-height:1;color:var(--wine);margin-top:14px;letter-spacing:-.01em}
h1 span{display:inline-block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
h1 span:nth-child(2){animation-delay:.12s}h1 span:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(3deg)}}
.stage{position:relative;height:min(62vh,470px);margin-top:3vh;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.rail{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.track{position:absolute;left:0;top:0;height:100%;will-change:transform}
.garment{position:absolute;top:29px;z-index:4;transform-origin:calc(50% + 7px) 10px;background:none;border:0;padding:0;cursor:inherit;color:inherit;will-change:transform}
.garment svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 14px rgba(42,11,19,.18))}
.price{position:absolute;left:8%;top:44px;background:var(--tag);color:#2a0b13;font-size:11px;font-weight:600;padding:3px 7px;border-radius:3px;transform:rotate(-14deg);box-shadow:0 2px 5px rgba(0,0,0,.25);z-index:2;pointer-events:none}
.price::before{content:"";position:absolute;right:-4px;top:5px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.ctl{display:flex;align-items:center;gap:18px;padding:0 5vw;margin-top:2vh;position:relative;z-index:5}
.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);font-size:18px;cursor:pointer;transition:background .2s}
.ctl button:hover{background:var(--gold);color:#2a0b13}
.bar{flex:1;height:2px;background:rgba(184,146,63,.3);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:4px;width:20%;background:var(--gold);border-radius:2px}
.ag{width:auto!important;border-radius:99px!important;padding:0 18px;font:600 13px Manrope,sans-serif!important}
.ag[aria-pressed="true"]{background:var(--gold);color:#2a0b13}
.note{text-align:right;font-size:12px;color:var(--muted);padding:0 5vw;max-width:340px;margin:14px 5vw 0 auto;line-height:1.5}
.sheet{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--wine);color:#f3ecdd;border-radius:16px;padding:16px 20px;display:flex;gap:20px;align-items:center;z-index:9;transition:transform .5s cubic-bezier(.2,.8,.2,1);width:min(92vw,460px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:22px}
.sheet p{font-size:13px;opacity:.8;margin-top:2px}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.sheet .alt{background:none;border:1px solid #b8923f;color:#f3ecdd}.sheet button{background:#b8923f;color:#2a0b13;border:0;border-radius:99px;padding:11px 18px;font:600 13px Manrope,sans-serif;cursor:pointer;white-space:nowrap}
@media(max-width:720px){nav ul{display:none}.note{display:none}}
.ctl{margin:2vh 5vw 0;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.12));-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -8px 18px rgba(255,255,255,.12),0 18px 40px rgba(74,14,26,.18),0 2px 6px rgba(74,14,26,.12);overflow:hidden;isolation:isolate}
.ctl::before{content:"";position:absolute;inset:-40%;z-index:-1;background:radial-gradient(circle at 20% 40%,rgba(184,146,63,.6),transparent 35%),radial-gradient(circle at 70% 60%,rgba(106,27,42,.5),transparent 38%),radial-gradient(circle at 90% 30%,rgba(37,64,47,.4),transparent 30%);animation:blob 9s ease-in-out infinite alternate}
@keyframes blob{to{transform:translate(8%,-10%) rotate(14deg) scale(1.1)}}
.ctl button{border:1px solid rgba(255,255,255,.75);background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.15));box-shadow:inset 0 1px 1px #fff,0 6px 14px rgba(74,14,26,.18);color:#2a0b13;flex:none}
.ctl button:hover{background:rgba(255,255,255,.75);color:#2a0b13}
.bar{flex:1;height:30px;border-radius:99px;background:rgba(255,255,255,.18);box-shadow:inset 0 2px 6px rgba(42,11,19,.28),inset 0 -1px 1px rgba(255,255,255,.6);position:relative;cursor:pointer;touch-action:none}
.bar i{position:absolute;top:2px;left:0;height:26px;width:90px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.22) 55%,rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 2px 2px #fff,inset 0 -6px 10px rgba(184,146,63,.4),0 6px 14px rgba(42,11,19,.3);-webkit-backdrop-filter:blur(3px) brightness(1.15) saturate(1.8);backdrop-filter:blur(3px) brightness(1.15) saturate(1.8);will-change:transform;transform-origin:center}
.ag[aria-pressed="true"]{background:linear-gradient(rgba(224,188,106,.95),rgba(184,146,63,.75))}
.bag{background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.15));-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 1px #fff,0 8px 18px rgba(74,14,26,.15);color:#2a0b13}
.sheet{background:rgba(74,14,26,.55);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 20px 50px rgba(0,0,0,.35)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* ---- shop additions ---- */
.sheet{padding:24px 20px 16px;align-items:flex-end}
.sheet .x{position:absolute;top:6px;right:8px;background:none;color:#f3ecdd;padding:4px 8px;font-size:16px;border-radius:8px}
.sizes{display:flex;gap:6px;margin-top:10px}
.sheet .sizes button{background:none;border:1px solid rgba(243,236,221,.5);color:#f3ecdd;padding:6px 12px;font-size:12px;border-radius:8px;min-width:38px}
.sheet .sizes button[aria-pressed="true"]{background:#b8923f;border-color:#b8923f;color:#2a0b13}
.bag.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.12)}}
.scrim{position:fixed;inset:0;background:rgba(20,5,9,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);color:var(--ink);z-index:21;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(184,146,63,.35)}
.dh h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:27px;color:var(--wine);flex:1}
.dh button{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);font-size:16px;cursor:pointer}
.dh button:hover{background:var(--gold);color:#2a0b13}
.drawer button:focus-visible,.drawer a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dbody{flex:1;overflow-y:auto;padding:6px 20px 22px;-webkit-overflow-scrolling:touch}
.dfoot{padding:14px 20px 18px;border-top:1px solid rgba(184,146,63,.35)}
.ci{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(184,146,63,.22);align-items:flex-start}
.th{width:66px;flex:none;background:rgba(184,146,63,.14);border-radius:8px;padding:4px}
.th svg{width:100%;height:auto;display:block}
.cm{flex:1;min-width:0}
.cm h4{font-size:14px;font-weight:600}
.cm p{font-size:12px;color:var(--muted);margin-top:2px}
.q{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.q .rm{width:auto;height:auto;border:0;border-radius:0;font-size:12px;color:var(--muted);text-decoration:underline;margin-left:6px}
.lp{font-size:14px;font-weight:600;white-space:nowrap}
.sm{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.sm.t{font-size:18px;font-weight:600;margin:10px 0 14px}
.btn{width:100%;border:0;border-radius:99px;padding:14px 18px;background:var(--gold);color:#2a0b13;font:600 14px Manrope,sans-serif;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.empty{text-align:center;padding:60px 10px;color:var(--muted);font-size:14px;line-height:1.7}
.empty p:first-child{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--wine)}
.fld{display:block;margin-top:13px;font-size:12px;color:var(--muted);letter-spacing:.03em}
.fld input,.fld textarea{display:block;width:100%;margin-top:5px;padding:12px 14px;font:16px Manrope,sans-serif;color:var(--ink);background:transparent;border:1px solid rgba(184,146,63,.7);border-radius:10px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.fld [aria-invalid="true"]{border-color:#d6453a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{margin-top:16px;display:grid;gap:8px;border:0;padding:0;min-width:0}
.pay legend{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(184,146,63,.5);border-radius:10px;padding:12px;font-size:13px;line-height:1.45;cursor:pointer}
.pay input{margin-top:2px;accent-color:#b8923f}
.err{color:#d6453a;font-size:13px;margin-top:14px;line-height:1.5}
.err a{color:inherit;font-weight:600}
.done{text-align:center;padding:26px 4px 6px}
.tick{width:64px;height:64px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;margin:0 auto 14px;font-size:28px;color:var(--gold)}
.done h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:28px;color:var(--wine)}
.done p{font-size:14px;line-height:1.6;color:var(--muted);margin-top:8px}
.done .oid{display:inline-block;margin:12px 0 4px;padding:6px 14px;border:1px dashed var(--gold);border-radius:99px;color:var(--ink);font-weight:600;letter-spacing:.06em;font-size:14px}
.done ul{list-style:none;padding:0;margin:16px 0 0;text-align:left;font-size:13px;border-top:1px solid rgba(184,146,63,.3)}
.done li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(184,146,63,.2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,220%);background:var(--wine);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:13px;z-index:19;transition:transform .45s cubic-bezier(.2,.8,.2,1);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.toast button{background:none;border:0;color:inherit;font:600 13px Manrope,sans-serif;text-decoration:underline;cursor:pointer;margin-left:8px}
@media(max-width:420px){.row{grid-template-columns:1fr}}
</style>
</head>

function save(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cnt(){return cart.reduce(function(a,l){return a+l.q},0)}
function sum(){return cart.reduce(function(a,l){return a+ITEMS[l.i][3]*l.q},0)}
function badge(pop){var b=$("bag");b.textContent="Bag ("+cnt()+")";if(pop){b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}}
function toast(msg,withView){var t=$("toast");t.textContent=msg;if(withView){var v=document.createElement("button");v.textContent="View bag";v.onclick=function(){t.classList.remove("on");openD("cart")};t.appendChild(v)}
  t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},3600)}
function thumb(i){var s=els[i]&&els[i].querySelector("svg");return s?s.outerHTML:""}
function summary(){return '<div class="sm"><span>Subtotal</span><span>'+fmt(sum())+'</span></div><div class="sm"><span>Delivery</span><span>Free</span></div><div class="sm t"><span>Total</span><span>'+fmt(sum())+'</span></div>'}

window.NA={add:function(i,s){var l=cart.filter(function(x){return x.i===i&&x.s===s})[0];
  if(l)l.q=Math.min(10,l.q+1);else cart.push({i:i,s:s,q:1});
  save();badge(true);toast(ITEMS[i][0]+" (size "+s+") added to bag",true)}};

function render(){
  var b=$("dbody"),f=$("dfoot"),t=$("dtitle");$("dback").hidden=(view!=="form");
  if(view==="cart"){
    t.textContent="Your bag";
    if(!cart.length){
      b.innerHTML='<div class="empty"><p>Your bag is empty</p><p>Tap any piece on the rail to add it.</p></div>';
      f.innerHTML='<button class="btn" id="cont">Keep browsing</button>';$("cont").onclick=closeD;return}
    b.innerHTML=cart.map(function(l,k){var it=ITEMS[l.i];
      return '<div class="ci"><div class="th">'+thumb(l.i)+'</div><div class="cm"><h4>'+esc(it[0])+'</h4><p>Size '+l.s+' · '+fmt(it[3])+' each</p>'+
      '<div class="q"><button data-a="-" data-k="'+k+'" aria-label="Decrease quantity">−</button><span aria-live="polite">'+l.q+'</span><button data-a="+" data-k="'+k+'" aria-label="Increase quantity">+</button><button class="rm" data-a="x" data-k="'+k+'">Remove</button></div></div>'+
      '<div class="lp">'+fmt(it[3]*l.q)+'</div></div>'}).join("");
    f.innerHTML=summary()+'<button class="btn" id="go">Checkout</button>';$("go").onclick=function(){view="form";render();$("dbody").scrollTop=0};
  }else if(view==="form"){
    t.textContent="Delivery details";
    b.innerHTML='<form id="oform" novalidate>'+
      '<label class="fld">Full name<input name="name" autocomplete="name" required></label>'+
      '<label class="fld">Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>'+
      '<label class="fld">Phone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>'+
      '<label class="fld">Address (house no., street, area)<textarea name="address" rows="2" autocomplete="street-address" required></textarea></label>'+
      '<div class="row"><label class="fld">City<input name="city" autocomplete="address-level2" required></label><label class="fld">State<input name="state" autocomplete="address-level1" required></label></div>'+
      '<label class="fld">PIN code<input name="pin" autocomplete="postal-code" inputmode="numeric" maxlength="6" required></label>'+
      '<fieldset class="pay"><legend>Payment</legend>'+
      '<label><input type="radio" name="pay" value="Cash on Delivery" checked><span>Cash on delivery<br>Pay when your order arrives.</span></label>'+
      '<label><input type="radio" name="pay" value="UPI / bank transfer"><span>UPI or bank transfer<br>We email you the payment details to confirm your order.</span></label></fieldset>'+
      '<label class="fld">Order notes (optional)<textarea name="notes" rows="2"></textarea></label>'+
      '<p class="err" id="ferr" role="alert"></p></form>';
    f.innerHTML=summary()+'<button class="btn" id="place" type="submit" form="oform">Place order</button>';
  }else{
    var o=lastOrder;t.textContent="Order placed";
    b.innerHTML='<div class="done"><div class="tick" aria-hidden="true">✓</div><h3>Thank you, '+esc(o.name.split(" ")[0])+'</h3>'+
      '<span class="oid">'+esc(o.id)+'</span><p>We have your order and will confirm it at '+esc(o.email)+' shortly. Keep this order number for reference.</p>'+
      '<ul>'+o.items.map(function(x){return '<li><span>'+esc(x.n)+' · '+x.s+' × '+x.q+'</span><span>'+fmt(x.p)+'</span></li>'}).join("")+
      '<li><strong>Total ('+esc(o.pay)+')</strong><strong>'+fmt(o.total)+'</strong></li></ul></div>';
    f.innerHTML='<button class="btn" id="cont">Keep browsing</button>';$("cont").onclick=closeD;
  }
}

function openD(v){view=v||"cart";$("toast").classList.remove("on");render();lastFocus=document.activeElement;
  var d=$("drawer");d.inert=false;d.setAttribute("aria-hidden","false");d.classList.add("on");$("scrim").classList.add("on");
  document.body.style.overflow="hidden";setTimeout(function(){$("dx").focus()},60)}
function closeD(){var d=$("drawer");d.classList.remove("on");d.setAttribute("aria-hidden","true");d.inert=true;$("scrim").classList.remove("on");
  document.body.style.overflow="";if(view==="done")view="cart";if(lastFocus&&lastFocus.focus)lastFocus.focus()}

$("bag").onclick=function(){openD("cart")};
$("dx").onclick=closeD;$("scrim").onclick=closeD;
$("dback").onclick=function(){view="cart";render()};
addEventListener("keydown",function(e){if(e.key==="Escape"&&$("drawer").classList.contains("on"))closeD()});
$("dbody").addEventListener("click",function(e){var a=e.target.closest("[data-a]");if(!a)return;
  var k=+a.getAttribute("data-k"),l=cart[k],op=a.getAttribute("data-a");if(!l)return;
  if(op==="+")l.q=Math.min(10,l.q+1);else if(op==="-")l.q-=1;else l.q=0;
  cart=cart.filter(function(x){return x.q>0});save();badge();render()});

function validate(d){
  if(d.name.length<2)return["name","Enter your full name."];
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email))return["email","Enter a valid email address so we can confirm your order."];
  var ph=d.phone.replace(/\D/g,"");if(ph.length<10||ph.length>13)return["phone","Enter a phone number with at least 10 digits."];
  if(d.address.length<8)return["address","Enter your full delivery address."];
  if(d.city.length<2)return["city","Enter your city."];
  if(d.state.length<2)return["state","Enter your state."];
  if(!/^\d{6}$/.test(d.pin))return["pin","Enter a 6-digit PIN code."];
  return null}
function orderId(){return"NA-"+Date.now().toString(36).toUpperCase().slice(-6)+Math.floor(10+Math.random()*90)}

$("dbody").addEventListener("input",function(e){if(e.target.removeAttribute)e.target.removeAttribute("aria-invalid")});
$("dbody").addEventListener("submit",function(e){
  e.preventDefault();if(sending||!cart.length)return;
  var form=e.target,d={},err=$("ferr");
  ["name","email","phone","address","city","state","pin","notes"].forEach(function(k){d[k]=(form.elements[k].value||"").trim()});
  d.pay=form.elements.pay.value;
  form.querySelectorAll("[aria-invalid]").forEach(function(x){x.removeAttribute("aria-invalid")});
  var bad=validate(d);if(bad){var fld=form.elements[bad[0]];fld.setAttribute("aria-invalid","true");err.textContent=bad[1];fld.focus();return}
  err.textContent="";
  var id=orderId(),T=sum(),
  items=cart.map(function(l){return{n:ITEMS[l.i][0],s:l.s,q:l.q,p:ITEMS[l.i][3]*l.q}}),
  lines=items.map(function(x){return x.n+" | Size "+x.s+" | Qty "+x.q+" | "+fmt(x.p)}).join("\n"),
  addr=d.address+", "+d.city+", "+d.state+" - "+d.pin;
  var payload={_subject:"New order "+id+" - "+fmt(T)+" - "+d.name,_template:"table",_captcha:"false",_honey:"",
    "Order ID":id,"Customer":d.name,"email":d.email,"Phone":d.phone,"Delivery address":addr,"Payment":d.pay,"Items":lines,
    "Order total":fmt(T)+" (free delivery)","Notes":d.notes||"-",
    _autoresponse:"Hi "+d.name+", thank you for your order "+id+" at Noir Atelier. Total: "+fmt(T)+" ("+d.pay+"). We will confirm it shortly."};
  var btn=$("place");sending=true;btn.disabled=true;btn.textContent="Placing order…";
  function fail(){
    sending=false;btn.disabled=false;btn.textContent="Place order";
    var body="Order "+id+"\n\nName: "+d.name+"\nEmail: "+d.email+"\nPhone: "+d.phone+"\nAddress: "+addr+"\nPayment: "+d.pay+"\n\n"+lines+"\n\nTotal: "+fmt(T)+"\nNotes: "+(d.notes||"-");
    var href="mailto:"+SHOP+"?subject="+encodeURIComponent("New order "+id)+"&body="+encodeURIComponent(body);
    err.innerHTML='We could not send your order. Check your connection and try again, or <a href="'+href+'">send it by email instead</a>.'}
  fetch("https://formsubmit.co/ajax/"+SHOP,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}},function(){return{ok:r.ok,j:{}}})})
    .then(function(x){
      if(!(x.ok&&(x.j.success===true||x.j.success==="true")))return fail();
      sending=false;lastOrder={id:id,name:d.name,email:d.email,pay:d.pay,total:T,items:items};
      cart=[];save();badge();view="done";render();$("dbody").scrollTop=0})
    .catch(fail);
});

badge();
})();
</script>
</body>
</html>
